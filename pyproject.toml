[project]
name = "diffBloch"
dynamic = ["version"]  # single-sourced from src/diffBloch/__init__.py (see [tool.hatch.version])
description = "Differentiable Bloch-wave electron-diffraction structure refinement"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
# Who maintains the software, in README-citation order. Deliberately NOT the paper's author list:
# Midgley is a co-author on the citation but not a maintainer of this package.
authors = [
    { name = "Tiarnan Doherty", email = "Td404@cam.ac.uk" },
    { name = "Shreshth Malik", email = "shreshth_malik@yahoo.co.uk" },
    { name = "Benjamin Colmey", email = "benjamincolmey@gmail.com" },
    { name = "Iain Maitland", email = "iain@iainmaitland.com" },
]
# `crystallography` is a keyword rather than a classifier because the trove list has no
# Crystallography entry (it stops at Chemistry/Physics) and PyPI rejects unknown classifiers.
keywords = [
    "electron-diffraction",
    "electron-crystallography",
    "crystallography",
    "bloch-wave",
    "structure-refinement",
    "automatic-differentiation",
    "pytorch",
]
# No `License ::` classifier: the SPDX `license` field above is PEP 639, and PyPI rejects an
# upload that declares the licence both ways. Python is claimed only for 3.12 -- `requires-python`
# admits 3.13+, but CI runs a single 3.12 job, so anything beyond that is untested.
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
    "Typing :: Typed",
]
dependencies = [
    "diffpy.structure>=3.2",  # io/symmetry_setup: ADP (Uij) special-position constraints + oracle
    "gemmi>=0.7.5",
    # Report plots are on by default (SummaryLogger.plot), so the renderer is not optional in
    # practice: as an extra it left the default output silently degraded and its code untested in
    # CI (`uv sync --dev` installs no extras). The wandb/comet SDKs below stay opt-in -- those are
    # external services, not part of any default run.
    "matplotlib>=3.7",
    "numpy>=2.5.2",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "scipy>=1.11",  # preprocess.steps.optimize_orientation: Nelder-Mead orientation search
    "torch>=2.13.0",  # >=2.13.0: GHSA-rrmf-rvhw-rf47 (torch.jit.script memory corruption)
    # Scientific deps are added as their modules land:
    #   abtem -> core/scattering (electron form factors), wrapped behind a seam
]

[project.urls]
Homepage = "https://diffBloch.com"
Documentation = "https://differentiable-electron-crystallography.github.io/diffBloch/"
Source = "https://github.com/Differentiable-Electron-Crystallography/diffBloch"
Issues = "https://github.com/Differentiable-Electron-Crystallography/diffBloch/issues"

[project.optional-dependencies]
# Logger backends confine their SDK to one module (diffBloch.app.loggers.*) and import it lazily;
# install the extra to use that backend. The core never imports these.
wandb = ["wandb>=0.28.2"]
comet = ["comet_ml>=3.58.4"]

[tool.uv]
# Security floors for packages we do not depend on directly: wandb pulls gitpython, torch and
# comet-ml pull setuptools. Pinned here so a future re-lock cannot drift back below the fix.
constraint-dependencies = [
    "gitpython>=3.1.58",  # 18 advisories through 3.1.57 (git option-injection / config-injection RCE)
    "setuptools>=83.0.0",  # GHSA-h35f-9h28-mq5c (sdist MANIFEST.in exclusion bypass)
]

[project.scripts]
diffbloch = "diffBloch.app.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/diffBloch/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/diffBloch"]

# Without an explicit sdist target hatchling ships the whole repo. That is not just bloat: every
# Git LFS path (*.npz, *.cif_pets per .gitattributes) lives under tests/ and examples/, and an
# sdist built from a shallow or pointer-only checkout would carry ~130-byte stubs in their place
# -- a distribution that installs cleanly and then fails at read time. The release workflow
# asserts this file list rather than trusting the config.
[tool.hatch.build.targets.sdist]
only-include = ["src/diffBloch", "README.md", "LICENSE", "REFERENCES.md"]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.16.3",
    "mypy>=2.3.0",
    "types-pyyaml>=6.0",
    "pre-commit>=4.6.2",
    # Sphinx docs: furo theme, MyST for the Markdown sources, autodoc+napoleon for the API reference.
    "sphinx>=7.4",
    "furo>=2024.8.6",
    "myst-parser>=4.0",
    "sphinx-copybutton>=0.5.2",
    "sphinxext-opengraph>=0.9.1",
    "sphinx-inline-tabs>=2023.4.21",
    "sphinx-autobuild>=2024.10.3",
    "jupyterlab>=4.6.3",
    "jupytext>=1.19.5",
    "ipykernel>=7.3.0",
]

[tool.pytest.ini_options]
addopts = "-m 'not e2e' --strict-markers"
testpaths = ["tests"]
# Cross-test-module imports (tests.unit.test_convergence helpers) need the repo root on sys.path.
# `python -m pytest` adds it implicitly; the plain `pytest` entrypoint (CI) does not.
pythonpath = ["."]
markers = [
    "e2e: end-to-end characterization tests (require data fixtures; opt-in via `just test-e2e`)",
    "slow: long-running tests",
]
filterwarnings = [
    # diffpy.structure 3.4 calls its own deprecated helpers inside SymmetryConstraints; not ours.
    "ignore:'diffpy.structure.*' is deprecated:DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# NOTE: no include-list. Unlike the research repo's incremental-lint crutch, the 2.0 rewrite is
# clean by construction, so the whole tree is linted from the first commit.

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM"]
# E501 (line length) temporarily ignored during the vocab-refactor: the renames lengthened many
# docstring/comment lines. Reflow and re-enable in the final docs/cleanup pass.
ignore = ["E501"]

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
explicit_package_bases = true
namespace_packages = true
strict = true
ignore_missing_imports = true
