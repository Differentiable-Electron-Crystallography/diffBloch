name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Sync (dev)
        run: uv sync --dev

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Typecheck
        run: uv run mypy src/diffBloch

      - name: Unit tests (with coverage)
        run: uv run pytest --cov=diffBloch --cov-report=term-missing

      - name: Build docs
        run: uv run mkdocs build --strict

      - name: Build package (wheel + sdist)
        run: uv build

  # The physics anchors: opt-in locally (`just anchor`), a separate job here so the fast checks
  # report first. Full 99-rotation static + integrated (CLI-driven) quartz pins, ~5-6 min on CPU.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Sync (dev)
        run: uv sync --dev

      - name: Physics anchors (e2e)
        run: uv run pytest -m e2e -q
