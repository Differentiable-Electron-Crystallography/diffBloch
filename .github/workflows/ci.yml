name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Sync (dev)
        run: uv sync --dev

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Typecheck
        run: uv run mypy src/diffBloch

      - name: Unit tests (with coverage)
        run: uv run pytest --cov=diffBloch --cov-report=term-missing

      - name: Build docs
        run: uv run mkdocs build --strict

      - name: Build package (wheel + sdist)
        run: uv build
  # NOTE: e2e tests (`-m e2e`) are intentionally not in CI yet — they need data fixtures + the
  # ported kernels (migration stage 0+). Add a separate e2e job once the anchor is real.
