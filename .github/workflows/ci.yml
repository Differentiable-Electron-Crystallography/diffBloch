name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Sync (dev)
        run: uv sync --dev

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Typecheck
        run: uv run mypy src/diffBloch

      - name: Unit tests (with coverage)
        run: uv run pytest --cov=diffBloch --cov-report=term-missing

      - name: Build docs
        run: uv run sphinx-build -W -b html docs docs/_build/html

      - name: Build package (wheel + sdist)
        run: uv build

  # Publish the docsite to GitHub Pages on every green main push (repo Pages source must be
  # "GitHub Actions"). PRs still validate the build via the check job's strict `sphinx-build -W`.
  docs-deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read  # job-level permissions REPLACE defaults; checkout still needs repo read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Sync (dev)
        run: uv sync --dev

      - name: Build docs
        run: uv run sphinx-build -W -b html docs docs/_build/html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # The physics anchors: opt-in locally (`just anchor`), a separate job here so the fast checks
  # report first. Full 99-rotation static + integrated (CLI-driven) quartz pins, ~5-6 min on CPU.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Sync (dev)
        run: uv sync --dev

      - name: Physics anchors (e2e)
        run: uv run pytest -m e2e -q
