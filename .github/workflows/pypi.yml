name: Release

# The whole release lives here: decide, build, publish, tag.
#
# Deliberately ONE workflow rather than a reusable pypi.yml called by a release.yml. PyPI's
# Trusted Publishing authenticates on the `job_workflow_ref` claim (the *called* workflow), while
# PEP 740 attestation verification checks the Sigstore certificate's Build Config URI, which
# carries `workflow_ref` (the *calling* workflow). Across a reusable-workflow boundary those two
# name different files; a PyPI publisher records only one workflow filename, so whichever you
# register, the other check fails -- authentication with `invalid-publisher`, or the upload with
# "Certificate's Build Config URI ... does not match expected Trusted Publisher". Collapsing the
# two workflows into one makes the claims agree.
# See https://docs.pypi.org/trusted-publishers/troubleshooting/#reusable-workflows-on-github
#
# Keep this file named pypi.yml. That filename is what the PyPI trusted publisher is registered
# against; renaming it breaks publishing until the publisher is edited to match.
#
# Releasing is an ordinary PR: bump __version__ in src/diffBloch/__init__.py, refresh the example
# locks alongside it (ci.yml's release-guard enforces that pairing), get it approved, merge. There
# is no command to run afterwards and no tag to push by hand.
#
# This fires on every push to main but only acts when __version__ names a version that has no tag
# yet, so an ordinary merge is a clean no-op.
on:
  push:
    branches: [main]
  # Re-run path for a release whose publish failed after the fact. Name the commit and the version
  # it carries; the build job refuses the pair if they disagree.
  workflow_dispatch:
    inputs:
      ref:
        description: Commit (or tag) to build and publish.
        required: true
        type: string
      version:
        description: Version you expect that ref to build, e.g. 0.2.1.
        required: true
        type: string

permissions:
  contents: read

jobs:
  decide:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.decide.outputs.sha }}
      version: ${{ steps.decide.outputs.version }}
      release: ${{ steps.decide.outputs.release }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0  # the tag list is the record of what has already been released
          # `inputs` is empty on a push event, so this takes the dispatched ref when there is one
          # and the pushed commit otherwise.
          ref: ${{ inputs.ref || github.sha }}

      # Keyed on "is this version already tagged" rather than on a HEAD^ diff: a merge that leaves
      # the version alone is a no-op, and a re-run after a mid-flight failure resumes instead of
      # deciding the release already happened. A workflow_dispatch is an explicit instruction to
      # publish, so it skips that check and always proceeds.
      - name: Decide whether this is a release
        id: decide
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          # Resolve whatever was checked out to a full commit sha, so a dispatch naming a tag or
          # an abbreviated sha still gives the build and tag jobs something unambiguous.
          sha=$(git rev-parse HEAD)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

          if [ -n "$DISPATCH_VERSION" ]; then
            # Manual re-run: take the operator's version at face value here. The build job's PEP
            # 440 comparison against the built wheel is what refuses a ref/version pair that
            # disagree, and it does so with proper normalisation.
            echo "version=$DISPATCH_VERSION" >> "$GITHUB_OUTPUT"
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "publishing $DISPATCH_VERSION from $sha (manual re-run)"
            exit 0
          fi

          version=$(sed -n 's/^__version__ = "\([^"]*\)".*/\1/p' src/diffBloch/__init__.py)
          if [ -z "$version" ]; then
            echo "::error::no __version__ assignment found in src/diffBloch/__init__.py"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "v$version is already tagged; nothing to release"
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "v$version is unreleased; publishing $version"
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: decide
    if: needs.decide.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.decide.outputs.sha }}
          lfs: true

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Build package (wheel + sdist)
        run: uv build

      # Two independent reads of __init__.py have to agree: the decide job's (which greps the
      # line) and hatchling's (which builds the wheel from it). This is a weaker guarantee than the
      # tag-vs-metadata check it replaces -- the file is the only source of truth now, so there is
      # no second number to disagree with it -- but it still catches a bug in that grep and a
      # workflow_dispatch naming a ref/version pair that don't match. Compare against the built
      # wheel (real metadata, not a re-parse of the source), normalising both through PEP 440 so
      # 0.3.0-rc1 and 0.3.0rc1 are treated as equal.
      - name: Check expected version against built version
        env:
          EXPECTED: ${{ needs.decide.outputs.version }}
        run: |
          uv run --no-project --with packaging python - <<'PY'
          import os, pathlib, sys
          from packaging.version import InvalidVersion, Version

          wheel = next(pathlib.Path("dist").glob("*.whl"))
          dist_v = Version(wheel.name.split("-")[1])
          expected = os.environ["EXPECTED"]
          try:
              expected_v = Version(expected)
          except InvalidVersion:
              sys.exit(f"::error::requested version {expected} is not a PEP 440 version")
          if expected_v != dist_v:
              sys.exit(
                  f"::error::caller asked for {expected_v}, but the build produced {dist_v}. "
                  "The requested ref does not carry the requested version."
              )

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as fh:
              fh.write(f"Built **diffBloch {dist_v}** -> publishing to **PyPI**\n")
          PY

      - name: Sync (dev)
        run: uv sync --dev

      # Redundant with CI on the PR -- `check` is a required status check on main -- but a PyPI
      # upload is irreversible (a version number can never be reused) and workflow_dispatch can
      # name any ref. Cheap insurance run directly against the artifact being shipped.
      - name: Unit tests
        run: uv run pytest

      - name: Verify sdist scope
        run: |
          sdist=$(ls dist/*.tar.gz)
          files=$(tar -tzf "$sdist" | sed 's|^[^/]*/||' | grep -v '/$' | grep -v '^$')
          # PKG-INFO and .gitignore are added by hatchling itself, not by only-include.
          unexpected=$(printf '%s\n' "$files" \
            | grep -Ev '^(src/diffBloch/|README\.md$|LICENSE$|REFERENCES\.md$|PKG-INFO$|pyproject\.toml$|\.gitignore$)' \
            || true)
          if [ -n "$unexpected" ]; then
            echo "::error::sdist contains paths outside the package:"
            printf '  %s\n' $unexpected
            exit 1
          fi
          for want in src/diffBloch/core/data/lobato.json src/diffBloch/py.typed; do
            printf '%s\n' "$files" | grep -qx "$want" \
              || { echo "::error::sdist is missing $want"; exit 1; }
          done

      # twine's check is the only thing that catches a README that fails to render on PyPI --
      # the project page falls back to raw text and there is no way to fix it without a new
      # version number.
      - name: Check distribution metadata
        run: uv run --with twine twine check --strict dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  pypi:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # PyPI Trusted Publishing
    environment:
      name: pypi
      url: https://pypi.org/p/diffBloch
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          name: dist
          path: dist

      - uses: pypa/gh-action-pypi-publish@v1.14.2

  # The tag is created LAST, and only once PyPI has accepted the upload. `decide` reads tag
  # existence as "already released", so tagging first would leave that marker behind on any publish
  # failure -- a flaky test, twine check on a bad README, a PyPI outage -- and the re-run would
  # silently skip. Tagging last means a failed release leaves no trace and re-running just works.
  tag:
    needs: [decide, pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # POST /git/refs rather than `git push`: the endpoint is create-only (422 if the ref already
      # exists), so a re-run can never force-move a published tag, and it needs no git identity on
      # the runner. The tag is the record that makes a lock's `code_version: <version>+g<sha>`
      # resolve back to source with `git checkout v<version>`.
      - name: Record the release as a tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ needs.decide.outputs.version }}
          SHA: ${{ needs.decide.outputs.sha }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/tags/$TAG" \
            -f sha="$SHA" \
            --silent
          echo "tagged $SHA as $TAG"
