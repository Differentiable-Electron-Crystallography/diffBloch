# Fast, deterministic hooks. Heavier checks (mypy, tests) run via `just check` / CI.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        # 2 MB: the committed frozen preprocess checkpoints (plan.npz, ~1 MB for the coupled quartz
        # plan) are deliberate; still catches accidental multi-MB data dumps.
        args: [--maxkb=2048]

  - repo: local
    hooks:
      # Use the project's uv-managed ruff (single source of truth with `just check` / CI), not a
      # separately-pinned mirror -- the two drifted (v0.5.7 vs 0.15.x) and disagreed on formatting.
      - id: ruff
        name: ruff (uv)
        entry: uv run ruff check --fix
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: ruff-format
        name: ruff-format (uv)
        entry: uv run ruff format
        language: system
        types_or: [python, pyi]
        require_serial: true
