# Real quartz characterization-anchor fixture (the published quartz PED dataset).
# This directory is the public experiment-directory seed; subsequent stages evolve this layout in
# place (rather than a parallel anchor fixture) as IO/core/run artifacts land.
name: quartz-anchor
inputs:
  structure: enantiomer_1.cif
  observations: exp_data.cif_pets
sample:
  thicknesses: [820.0]
numerics:
  g_max: 4.5
  g_max_refine: 1.6
  rocking_curve_sampling: 42
  dsg: 0.0015
  rsg: 0.9
solver:
  inference: bloch_eigen
  refine: matrix_exp
refinement:
  split:
    train: all_except_validation
    validation: every_10th_rotation
