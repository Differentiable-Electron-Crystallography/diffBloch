site_name: diffBloch
site_description: Differentiable Bloch-wave electron-diffraction structure refinement
site_url: https://differentiable-electron-crystallography.github.io/diffBloch/

theme:
  name: shadcn
  # Local template overrides (shadow the theme by matching path); see overrides/templates/footer.html
  # which drops the upstream "shadcn theme provided by @asiffer" footer credit.
  custom_dir: overrides

# shadcn renders Pygments-tokenized code (it ships the stylesheets) and adds copy buttons natively,
# but the highlighting extensions must be enabled explicitly (Material bundled them).
markdown_extensions:
  fenced_code:
  codehilite:
  admonition:

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          # Sphinx-style inventories: external types in signatures/docstrings (torch.Tensor,
          # np.ndarray, Path, pydantic models, ...) become links into their own docs.
          inventories:
            - https://docs.python.org/3/objects.inv
            - https://numpy.org/doc/stable/objects.inv
            - https://docs.pytorch.org/docs/stable/objects.inv
            - https://docs.pydantic.dev/latest/objects.inv
          options:
            docstring_style: google
            show_source: true
            show_signature_annotations: true
            separate_signature: true
            signature_crossrefs: true

nav:
  - Home: index.md
  - Guides:
      - Architecture: architecture.md
      - Inputs: inputs.md
      - Preprocessing: preprocessing.md
      - Reproducibility: reproducibility.md
      - Refinement: refinement.md
      - Observability: observability-guide.md
      - Examples: examples.md
      - Model composition: model-composition.md
      - Beams and scoring: beams-and-scoring.md
      - Rocking curve and coupling: rocking-curve.md
  - API:
      - Config: api/config.md
      - IO: api/io.md
      - Core: api/core.md
      - Params: api/params.md
      - Specs: api/specs.md
      - Engine: api/engine.md
      - Preprocess: api/preprocess.md
      - Observability: api/observability.md
      - App: api/app.md
