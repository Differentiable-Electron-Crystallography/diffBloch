site_name: diffBloch
site_description: Differentiable Bloch-wave electron-diffraction structure refinement

theme:
  name: material
  features:
    - navigation.sections
    - content.code.copy

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: true
            show_signature_annotations: true
            separate_signature: true

nav:
  - Home: index.md
  - API:
      - Config: api/config.md
