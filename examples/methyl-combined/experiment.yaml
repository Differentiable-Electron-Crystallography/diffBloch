# Methyl-something organic molecular crystal, combined multi-dataset (dose6 + dose4).
# Structure has hydrogens (C26 O14 H34 in the ASU); cell volume ~1262 A^3.
#
# inputs.multi_dataset: true combines rotations from both PETS files into one experiment (running
# rotation_index across both, not restarting at 0 per file). Same crystal/config as
# examples/methyl-multi-dataset (dose6 alone) and examples/methyl-dose4 (dose4 alone) --
# dose6 (0.0251 A wavelength, ~200 kV) and dose4 (0.0198 A, ~300 kV) each keep their own energy;
# both already share the same integration_semiangle (1.5 deg), which combining requires.
name: methyl-combined

inputs:
  structure: refined_structure_GT_iso_fixed_adps.cif
  multi_dataset: true
  exp_data:
    - methyl_dose6.cif_pets
    - methyl_dose4.cif_pets
  load_hydrogens: true

sample:
  # One seed thickness per combined dataset, in inputs.exp_data order (methyl_dose6, methyl_dose4).
  thicknesses: [[1400.0], [1500.0]]

preprocess:
  optimize_orientation: true
  optimize_thickness: false

blochwave:
  g_max: 1.9
  sg_max: 0.01
  rocking_curve_sampling: 80
  dsg: 0.0
  rsg: 0.6

loss_metrics:
  residual: wr2

refinement:
  steps: 40
  optimizer:
    name: adam
    lr: 0.001
  trainable:
    positions: all
    adp: all
    occupancy: none
  split:
    train_test: false
  thickness_nn:
    enabled: true
    num_samples: 40
    sample_thickness: false
    min_thickness: 100.0
    max_thickness: 2000.0
