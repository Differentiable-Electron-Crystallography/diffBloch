# Elastic (no-absorption) counterpart of the Colmey et al. quartz orientation experiment.
name: colmey-et-al-2026-quartz-no-abs

inputs:
  structure: experimental_paper_files/enantiomer_1.cif
  exp_data: quartz.cif_pets
  load_hydrogens: true

sample:
  thicknesses: [850.0]

blochwave:
  coupling_mode: union
  absorption: false
  g_max: 2.0
  sg_max: 0.01
  rocking_curve_sampling: 42
  dsg: 0.0015
  rsg: 0.9
  ignore_orientations: []

preprocess:
  optimize_orientation: true
  optimize_thickness: false
  orientation:
    nelder_mead:
      step_size: 1
      max_iterations: 60
      x_tolerance: 0.001
      f_tolerance: 0.001
      penalize_fewer_reflections: true
  thickness:
    min_thickness: 5.0
    max_thickness: 1000.0
    n_steps: 100

loss_metrics:
  residual: wr2

refinement:
  steps: 40
  thickness_nn:
    enabled: true
    num_samples: 40
    sample_thickness: false
    form: min_thickness
    min_thickness: 1000.0
    max_thickness: 2000.0
    init_seed: 0
  optimizer:
    name: adam
    lr: 0.001
  trainable:
    positions: all
    adp: all
    occupancy: none
  split:
    train_test: false
