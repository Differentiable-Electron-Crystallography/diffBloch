# Malik et al. 2026 — quartz synthetic dataset port.
name: malik-2026-quartz-synthetic

inputs:
  structure: data/quartz/synthetic_data/synthetic_structural_data_paper/quartz_02_displacement.cif
  observations: data/quartz/synthetic_data/synthetic_structural_data_paper/quartz_paper_data.cif_pets
  load_hydrogens: false

sample:
  thicknesses: [500.0]

numerics:
  g_max: 2.0
  g_max_refine: 1.6
  rocking_curve_sampling: 42
  dsg: 0.0015
  rsg: 0.9
  integration:
    semiangle: 1.0

solver:
  inference: bloch_eigen
  refine: matrix_exp

preprocess:
  coupling:
    n_splits: 12
    g_max: 1.0
    cap_margin: 0.2
    sg_max: 0.01

refinement:
  split:
    train: all_except_validation
    validation: every_10th_rotation
