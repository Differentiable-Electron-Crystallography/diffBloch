# Malik et al. 2026, Nature Communications — CsPbBr3 synthetic dataset port.
# Source data/config: Zenodo DOI 10.5281/zenodo.18281349, original config
# `configs/experiment/cspbbr3_synthetic.yaml`.
name: malik-2026-cspbbr3-synthetic

inputs:
  structure: data/cspbbr3/synthetic_data/synthetic_structural_data_paper/cspbbr3_02_displacement.cif
  observations: data/cspbbr3/synthetic_data/synthetic_structural_data_paper/cspbbr3_paper_data.cif_pets
  load_hydrogens: false

sample:
  # The original Malik config trains a thickness model over roughly this range rather than declaring
  # one fixed thickness. This seed is an execution placeholder for the public preprocess/scoring path
  # and should be revisited during the paper-method implementation.
  thicknesses: [820.0]

numerics:
  # From the Malik cspbbr3_synthetic Hydra config (g_max_sf=5.0 was the SF grid; the beam/coupling
  # cutoff is 2.5 and the grid is derived as 2x it): g_max_refine=1.0, integration_semiangle=1.5,
  # rocking_curve_sampling=60, dsg=0.0015, rsg=0.66.
  g_max_refine: 1.0
  rocking_curve_sampling: 60
  dsg: 0.0015
  rsg: 0.66
  integration:
    semiangle: 1.5

solver:
  inference: bloch_eigen
  refine: matrix_exp

preprocess:
  # Public explicit coupling analog for the original private/default TiltSegmentUnion with
  # g_max_sf=5.0 SF grid): coupling radius g_max=2.5 (cap = g_max, no margin post-#154);
  # SF grid derived as 2 * g_max + 0.5.
  coupling:
    n_splits: 12
    g_max: 2.5
    sg_max: 0.01

refinement:
  split:
    train: all_except_validation
    validation: every_10th_rotation
