# Quartz chirality proof-of-concept: opposite-hand candidate.
#
# This experiment keeps the exact same observed PETS2 data and numerical recipe as ../matching-hand,
# but swaps the starting structure to the P3_1 21 enantiomorph. If the dynamical Bloch-wave model is
# discriminating handedness, this candidate should settle at a larger R-loss than matching-hand.
name: quartz-chirality-opposite-hand

inputs:
  structure: quartz_P3121.cif
  observations: quartz_exp_data.cif_pets

sample:
  thicknesses: [820.0]

numerics:
  g_max_refine: 1.6
  rocking_curve_sampling: 42
  dsg: 0.0015
  rsg: 0.9

solver:
  inference: bloch_eigen
  refine: matrix_exp

preprocess:
  coupling:
    fixed_n_segments: 12
    g_max: 2.25
    sg_max: 0.01

refinement:
  precision: fp32
  split:
    train: all_except_validation
    validation: every_10th_rotation
