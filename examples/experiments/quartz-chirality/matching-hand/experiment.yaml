# Quartz chirality proof-of-concept: matching-hand candidate.
#
# This experiment scores/refines the observed quartz PETS2 data against the P3_2 21 hand already
# used by the canonical quartz example. Compare with ../opposite-hand using the same observations and
# numerical recipe: the wrong hand is expected to settle at a larger R-loss.
name: quartz-chirality-matching-hand

inputs:
  structure: quartz_P3221.cif
  observations: quartz_exp_data.cif_pets

sample:
  thicknesses: [820.0]

numerics:
  g_max_refine: 1.6
  rocking_curve_sampling: 42
  dsg: 0.0015
  rsg: 0.9

solver:
  inference: bloch_eigen
  refine: matrix_exp

preprocess:
  coupling:
    fixed_n_segments: 12
    g_max: 2.25
    sg_max: 0.01

refinement:
  precision: fp32
  split:
    train: all_except_validation
    validation: every_10th_rotation
