# Example experiment: quartz (SiO2) inference, shipping a FROZEN preprocess checkpoint.
#
# Identical inputs and recipe to the sibling `quartz` example, but this directory also ships a
# pre-computed `plan.npz` + `plan.lock` (the settled coupled preprocess Plan). So the first
# `diffbloch run infer examples/experiments/quartz-checkpoint` REUSES the checkpoint and scores in
# seconds — no ~6–16 min fit — reaching the same mean R_obs = 0.0506. The checkpoint reuse gate keys
# on the release version, so it stays valid across commits within a diffBloch release.
#
#   quartz.cif                the SiO2 structure (space group P3_1 21)
#   quartz_exp_data.cif_pets  the observed reflection intensities (PETS .cif_pets)
#   plan.npz / plan.lock      the frozen coupled preprocess checkpoint (committed)
name: quartz-checkpoint

inputs:
  structure: quartz.cif
  exp_data: quartz_exp_data.cif_pets

sample:
  thicknesses: [820.0] # crystal thickness (Angstrom); optimize_thickness refines around this seed

blochwave:
  rocking_curve_sampling: 42 # tilt samples per rocking curve
  dsg: 0.0015 # Klar beam-selection excitation-error cutoff
  rsg: 0.9 # Klar beam-selection relative-intensity cutoff

  # Per-trial SOLVE-union coupling for the orientation fit. Declared explicitly because coupling has
  # no config default -- it determines the fit's physics. These are the faithful diffBloch_private
  # values (UnionCoupling defaults).
  g_max: 2.25
  sg_max: 0.01

refinement:
  split:
    train: all_except_validation
    validation: every_10th_rotation
