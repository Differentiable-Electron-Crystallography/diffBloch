name: colmey-et-al-2026-borane-no-abs

inputs:
  structure: borane_IAM_4.cif
  exp_data: borane_dyn_final_16.cif_pets
  load_hydrogens: true

sample:
  thicknesses: [1900.0]

blochwave:
  solver:
    refine: matrix_exp
    inference: matrix_exp
  absorption: false
  coupling_mode: union
  g_max: 1.9
  sg_max: 0.01
  rocking_curve_sampling: 125
  dsg: 0.0
  rsg: 0.66
  ignore_orientations: []

preprocess:
  optimize_orientation: true
  optimize_thickness: false
  orientation:
    nelder_mead:
      step_size: 1
  thickness:
    min_thickness: 100.0
    max_thickness: 2500.0
    n_steps: 100
    plot: false

loss_metrics:
  residual: robs

refinement:
  steps: 40
  thickness_nn:
    enabled: true
    num_samples: 40
    sample_thickness: false
    form: min_thickness
    min_thickness: 1000.0
    max_thickness: 2500.0
    init_seed: 0
  optimizer:
    name: adam
    lr: 0.001
  trainable:
    positions: all
    adp: all
    occupancy: none
  split:
    train_test: false
    val_frac: 0.1
