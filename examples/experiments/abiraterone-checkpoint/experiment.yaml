# Abiraterone acetate 3D-ED — molecular-crystal preprocess checkpoint (real data, private lineage).
#
# The first molecular-crystal example the public config path can express end to end: a well-
# conditioned organic crystal (P2_1 2_1 2_1, sg 19) whose faithful preprocess needs two things the
# app path previously could not state -- hydrogens in the forward model and an experiment-specific
# per-trial coupling. Both are now explicit config (`inputs.load_hydrogens`, `preprocess.coupling`),
# so `diffbloch run preprocess examples/experiments/abiraterone-checkpoint` settles the coupled Plan
# (fitted orientations + thickness) with no bespoke script, and this directory ships that frozen
# checkpoint (plan.npz + plan.lock) so the fit is paid once.
#
#   abiraterone.cif                the structure (space group P2_1 2_1 2_1)
#   abiraterone_exp_data.cif_pets  the observed reflection intensities (PETS .cif_pets)
#   plan.npz / plan.lock           the frozen coupled preprocess checkpoint (committed)
name: abiraterone-checkpoint

inputs:
  structure: abiraterone.cif
  observations: abiraterone_exp_data.cif_pets
  load_hydrogens: true # H contribute to the forward scattering (F_gb); molecular crystal

sample:
  thicknesses: [1460.0] # crystal thickness (Angstrom); fit_thickness refines around this seed

numerics:
  # Match the private abiraterone configuration: structure-factor grid g_max 3, scoring/seed-pool
  # g_max_refine 1, and the rocking-curve integration geometry (dsg/rsg/sampling/semiangle).
  g_max_refine: 1.0
  rocking_curve_sampling: 30
  dsg: 0.0025
  rsg: 0.6
  integration:
    semiangle: 1.422

solver:
  inference: bloch_eigen # forward model used for scoring (eigen-decomposition Bloch solver)
  refine: matrix_exp # gradient-safe solver used inside the preprocess fits

preprocess:
  # Abiraterone's per-trial SOLVE-union coupling -- experiment-specific, distinct from quartz's
  # faithful defaults. Coupling radius g_max = 1.5; the SF grid is derived as 2 * g_max = 3.0 to
  # span the beam-difference support. Declared explicitly because coupling has no config default.
  coupling:
    n_splits: 4
    g_max: 1.5
    sg_max: 0.02

refinement:
  precision: fp32
  # Stable execution knobs for the DEFAULT `diffbloch run refine` path: refine positions + ADPs
  # against the observed intensities, Adam at the private abiraterone learning rate. This is the
  # boring config-knobs default; it composes no hard constraints. Hydrogen *riding* (deriving each H
  # from its parent) is scientific composition expressed in Python via engine.with_hydrogen_riding /
  # build_refinement_problem -- see the abiraterone runner -- not a YAML mode.
  #
  # This block (bar `split`) is outside the preprocess config_digest, so editing optimizer / steps
  # never restales the committed plan.npz checkpoint above.
  steps: 200
  trainable:
    positions: all
    adp: all
  optimizer:
    name: adam
    lr: 1.0e-3
  split:
    train: all_except_validation
    validation: every_10th_rotation
